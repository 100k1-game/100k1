<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квиз — День нефтяной и газовой промышленности</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page-bg"></div>

  <main class="container">
    <header class="hero">
      <div class="hero-badge">5 сентября</div>
      <h1>День работников<br>нефтяной и газовой<br>промышленности</h1>
      <p class="hero-sub">Проверьте знания отрасли — пройдите квиз и соревнуйтесь с коллегами</p>
    </header>

    <section class="card form-card">
      <h2>Регистрация участника</h2>
      <form id="registerForm">
        <div class="field">
          <label for="name">ФИО</label>
          <input type="text" id="name" name="name" placeholder="Иванов Иван Иванович" required autocomplete="name">
        </div>
        <div class="field">
          <label for="specialty">Специальность</label>
          <input type="text" id="specialty" name="specialty" placeholder="Инженер-технолог" required>
        </div>
        <p class="error-msg" id="errorMsg" hidden></p>
        <button type="submit" class="btn btn-primary btn-full" id="startBtn">
          Начать
          <span class="btn-arrow">→</span>
        </button>
      </form>
    </section>

    <footer class="footer-note">
      <span class="dot-live"></span> Онлайн-квиз · 10 вопросов
    </footer>
  </main>

  <script src="/static/js/guest.js"></script>
</body>
</html>
